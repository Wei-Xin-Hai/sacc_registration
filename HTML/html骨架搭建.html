<!DOCTYPE html>
<!--lang属性标志了页面的语言-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--适配移动端-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--title为网页标题-->
<title>我的第一个网页</title>
</head>
<body>
    <h1>一级标题（最大）</h1>
        <p>这是一个段落。</p>
        <p>这是另一个段落。</p>
    <h2>二级标题</h2>
        <p>第一行<br>第二行</p>
        <hr>
        <p>上面有一条水平分割线</p>
    <!-- ... -->
    <h6>六级标题（最小）</h6>
</body>
</html>
